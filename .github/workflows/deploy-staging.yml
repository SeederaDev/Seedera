name: Build & deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Marca quale commit e' online: permette di verificare che Plesk abbia
      # davvero deployato con un curl su /version.txt, senza aprire il pannello.
      - run: echo "$GITHUB_SHA" > out/version.txt

      # Next esporta /portfolio sia come portfolio.html sia come cartella
      # portfolio/ (le pagine progetto). Senza questa rewrite Apache tratta
      # /portfolio come directory, non trova index.html e risponde 403.
      # Niente condizione !-d: e' proprio il caso file+cartella omonimi.
      - name: Add .htaccess
        run: |
          cat > out/.htaccess <<'EOF'
          Options -MultiViews -Indexes

          # Senza questo mod_dir vede la cartella portfolio/ e redirige
          # /portfolio a /portfolio/ prima che la rewrite possa agire.
          # L'export non genera index.html nelle sottocartelle, quindi
          # disattivarlo non toglie niente.
          DirectorySlash Off

          RewriteEngine On

          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME}.html -f
          RewriteRule ^(.*)$ $1.html [L]

          ErrorDocument 404 /404.html
          EOF

      # Commit SOPRA il branch deploy esistente, mai git init + force push:
      # Plesk aggiorna il sito con un git pull, e una storia riscritta da capo
      # non e' fast-forward, quindi il pull fallisce e il deploy non avviene.
      - name: Push build to deploy branch
        run: |
          git clone -q --depth 1 --branch deploy \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            deploy-repo

          rsync -a --delete --exclude .git out/ deploy-repo/

          cd deploy-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nessuna modifica nel build, niente da deployare."
          else
            git commit -q -m "Deploy ${GITHUB_SHA::7}"
            git push -q origin deploy
          fi
