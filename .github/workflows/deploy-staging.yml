name: Build & deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Gli endpoint del backend proprietario (repo SeederaDev/seedera-backend)
      # sono letti da process.env alla build: il sito e' un export statico, e
      # senza queste due variabili i form ricadono sul mailto invece di inviare.
      - run: npm run build
        env:
          NEXT_PUBLIC_FORM_ENDPOINT: https://api.seedera.it/api/lead
          NEXT_PUBLIC_VOUCHER_ENDPOINT: https://api.seedera.it/api/voucher/onboarding

      # Marca quale commit e' online: permette di verificare che Plesk abbia
      # davvero deployato con un curl su /version.txt, senza aprire il pannello.
      - run: echo "$GITHUB_SHA" > out/version.txt

      # Next esporta /portfolio sia come portfolio.html sia come cartella
      # portfolio/ (le pagine progetto). Senza questa rewrite Apache tratta
      # /portfolio come directory, non trova index.html e risponde 403.
      # Niente condizione !-d: e' proprio il caso file+cartella omonimi.
      - name: Add .htaccess
        run: |
          cat > out/.htaccess <<'EOF'
          Options -MultiViews -Indexes

          # Senza questo mod_dir vede la cartella portfolio/ e redirige
          # /portfolio a /portfolio/ prima che la rewrite possa agire.
          # L'export non genera index.html nelle sottocartelle, quindi
          # disattivarlo non toglie niente.
          DirectorySlash Off

          RewriteEngine On

          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME}.html -f
          RewriteRule ^(.*)$ $1.html [L]

          ErrorDocument 404 /404.html
          EOF

      # Commit SOPRA il branch deploy esistente, mai git init + force push:
      # Plesk aggiorna il sito con un git pull, e una storia riscritta da capo
      # non e' fast-forward, quindi il pull fallisce e il deploy non avviene.
      - name: Push build to deploy branch
        run: |
          git clone -q --depth 1 --branch deploy \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            deploy-repo

          # NIENTE rsync qui. Il suo quick-check salta i file con stessa
          # dimensione e stesso mtime al secondo, e fra due build consecutivi
          # index.html cambia solo l'hash dei chunk: stessa lunghezza. Se il
          # clone del branch deploy cade nello stesso secondo in cui Next ha
          # scritto out/, l'HTML resta quello vecchio mentre i chunk (nomi
          # nuovi) vengono sostituiti: la pagina chiede un chunk cancellato,
          # 404, e Next mostra "Application error: a client-side exception".
          # E' successo davvero nel deploy di 2775a3d. Svuotare e ricopiare
          # non dipende dai timestamp.
          find deploy-repo -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a out/. deploy-repo/

          cd deploy-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nessuna modifica nel build, niente da deployare."
          else
            git commit -q -m "Deploy ${GITHUB_SHA::7}"
            git push -q origin deploy
          fi

      # Rete di sicurezza: se per qualsiasi motivo l'albero deployato tornasse
      # incoerente, meglio un job rosso che uno staging bianco. Gira dopo il
      # push perche' controlla esattamente cio' che Plesk andra' a scaricare.
      - name: Verify deployed tree
        run: |
          cd deploy-repo

          deployed=$(cat version.txt)
          if [ "$deployed" != "$GITHUB_SHA" ]; then
            echo "::error::version.txt e' $deployed invece di $GITHUB_SHA: albero misto."
            exit 1
          fi

          missing=0
          while read -r asset; do
            [ -f "$asset" ] || { echo "::error::Asset referenziato ma assente: /$asset"; missing=1; }
          done < <(grep -rhoE '_next/static/[A-Za-z0-9._/-]+\.(js|css|ttf|woff2?)' --include='*.html' . | sort -u)
          exit $missing
